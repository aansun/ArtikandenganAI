name: BookTranslator
options:
  bundleIdPrefix: com.aansun
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_DEBUG_DYLIB: NO
targets:
  BookTranslator:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Book Translator
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        # Where the Python engine lives; the app asks for it once if this is wrong.
        BTBackendRoot: "$(SRCROOT)/../.."
        # Latest-release JSON of the project's repository (GitHub releases API).
        BTUpdateFeed: "https://api.github.com/repos/aansun/ArtikandenganAI/releases/latest"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aansun.BookTranslator
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  BookTranslatorTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: BookTranslator
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BookTranslator.app/Contents/MacOS/BookTranslator"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BookTranslator:
    build:
      targets:
        BookTranslator: all
        BookTranslatorTests: [test]
    test:
      targets: [BookTranslatorTests]
